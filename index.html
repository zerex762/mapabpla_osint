<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Defense — Доступ обмежено</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .alert-card {
            background: #131b2e;
            border-left: 4px solid #f59e0b;
            padding: 24px;
            border-radius: 12px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .alert-title {
            display: flex;
            align-items: center;
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 12px;
        }

        .alert-title span {
            margin-right: 8px;
            font-size: 20px;
        }

        .alert-text {
            font-size: 14px;
            color: #9ca3af;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .tg-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0088cc, #00abff);
            color: #ffffff;
            font-weight: 600;
            font-size: 14px;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(0, 136, 204, 0.3);
            width: 100%;
        }

        .tg-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 136, 204, 0.5);
        }

        .tg-button span {
            margin-left: 8px;
            transition: transform 0.2s ease;
        }

        .tg-button:hover span {
            transform: translateX(4px);
        }

        .support-info {
            margin-top: 16px;
            font-size: 13px;
            color: #6b7280;
            display: flex;
            align-items: center;
        }

        .support-info a {
            color: #38bdf8;
            text-decoration: none;
            margin-left: 4px;
        }

        .support-info a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="alert-card">
        <div class="alert-title">
            <span>⚠️</span> Мапа закрита для загального доступу
        </div>
        <div class="alert-text">
            Але її можна буде подивитися на стрімах! Всі анонси трансляцій та важливі оновлення публікуємо тут:
        </div>
        <a href="https://t.me/odessa_osint26" target="_blank" class="tg-button">
            Перейти в Telegram <span>→</span>
        </a>
        <div class="support-info">
            ❤️ Якщо є питання: <a href="https://t.me/Sky_defensee" target="_blank">@Sky_defensee</a>
        </div>
    </div>

</body>
</html>
